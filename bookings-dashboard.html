<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreshBin — Bookings Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a1f14; color:#fff; font-family:'DM Sans',sans-serif; min-height:100vh; }

/* NAV */
.nav { background:#0d2418; border-bottom:1px solid rgba(0,200,150,0.15); padding:14px 24px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
.nav-logo { font-family:'Bebas Neue',sans-serif; font-size:22px; color:#00C896; letter-spacing:2px; }
.nav-right { display:flex; align-items:center; gap:12px; }
.refresh-btn { background:#00C896; color:#000; border:none; border-radius:8px; padding:8px 18px; font-weight:700; font-size:13px; cursor:pointer; font-family:'DM Sans',sans-serif; }
.refresh-btn:hover { background:#00a87e; }
.live-dot { width:8px; height:8px; border-radius:50%; background:#00C896; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
.live-label { font-size:12px; color:rgba(255,255,255,0.5); }

/* STATS BAR */
.stats-bar { display:flex; gap:12px; padding:16px 24px; overflow-x:auto; }
.stat-card { background:#0d2418; border:1px solid rgba(0,200,150,0.15); border-radius:12px; padding:14px 20px; min-width:140px; flex:1; }
.stat-val { font-family:'Bebas Neue',sans-serif; font-size:28px; color:#00C896; }
.stat-lbl { font-size:11px; color:rgba(255,255,255,0.45); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px; }

/* DAY TABS */
.tabs-wrap { padding:0 24px; margin-top:8px; }
.tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; }
.tab { background:#0d2418; border:1px solid rgba(255,255,255,0.08); border-radius:20px; padding:8px 18px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap; color:rgba(255,255,255,0.5); transition:all 0.2s; }
.tab.active { background:#00C896; color:#000; border-color:#00C896; }
.tab:hover:not(.active) { border-color:#00C896; color:#00C896; }
.tab-count { background:rgba(255,255,255,0.15); border-radius:10px; padding:1px 7px; font-size:10px; margin-left:4px; }
.tab.active .tab-count { background:rgba(0,0,0,0.2); }

/* MAIN LAYOUT */
.main { display:grid; grid-template-columns:1fr 380px; gap:0; height:calc(100vh - 130px); }
@media(max-width:900px){ .main{ grid-template-columns:1fr; } #map-container{ display:none; } }

/* BOOKINGS LIST */
.bookings-panel { overflow-y:auto; padding:16px 24px; }
.day-label { font-family:'Bebas Neue',sans-serif; font-size:20px; color:#00C896; letter-spacing:1px; margin-bottom:12px; }
.booking-card { background:#0d2418; border:1px solid rgba(255,255,255,0.08); border-radius:14px; padding:16px; margin-bottom:10px; transition:border-color 0.2s; position:relative; }
.booking-card:hover { border-color:rgba(0,200,150,0.3); }
.booking-card.done { opacity:0.45; }
.card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.card-num { background:#00C896; color:#000; font-weight:800; font-size:12px; border-radius:50%; width:24px; height:24px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.card-info { flex:1; }
.card-name { font-weight:700; font-size:15px; }
.card-address { font-size:12px; color:rgba(255,255,255,0.5); margin-top:2px; }
.card-badges { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.badge { padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; }
.badge-plan { background:rgba(0,200,150,0.15); color:#00C896; border:1px solid rgba(0,200,150,0.3); }
.badge-bins { background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.7); }
.badge-price { background:rgba(0,200,150,0.1); color:#00C896; }
.badge-water-yes { background:rgba(0,200,150,0.1); color:#00C896; }
.badge-water-no { background:rgba(255,80,80,0.1); color:#ff5050; }
.badge-water-unsure { background:rgba(255,200,0,0.1); color:#ffc800; }
.card-actions { display:flex; gap:8px; margin-top:12px; }
.action-btn { flex:1; padding:8px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; border:none; font-family:'DM Sans',sans-serif; text-align:center; text-decoration:none; display:flex; align-items:center; justify-content:center; gap:5px; }
.btn-nav { background:#1a3a2a; color:#00C896; border:1px solid rgba(0,200,150,0.3); }
.btn-nav:hover { background:#00C896; color:#000; }
.btn-call { background:#1a3a2a; color:#fff; border:1px solid rgba(255,255,255,0.1); }
.btn-call:hover { background:#2a4a3a; }
.btn-done { background:#1a3a2a; color:rgba(255,255,255,0.5); border:1px solid rgba(255,255,255,0.08); }
.btn-done.completed { background:rgba(0,200,150,0.15); color:#00C896; border-color:rgba(0,200,150,0.3); }

/* MAP */
#map-container { border-left:1px solid rgba(255,255,255,0.06); }
#map { width:100%; height:100%; }

/* LOADING / EMPTY */
.loading { text-align:center; padding:60px 20px; color:rgba(255,255,255,0.3); }
.loading-spinner { width:32px; height:32px; border:3px solid rgba(0,200,150,0.2); border-top-color:#00C896; border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 12px; }
@keyframes spin { to{transform:rotate(360deg);} }
.empty { text-align:center; padding:40px 20px; color:rgba(255,255,255,0.3); font-size:13px; }
</style>
</head>
<body>

<div id="auth-gate" style="position:fixed;inset:0;background:#0a1f14;display:flex;align-items:center;justify-content:center;z-index:9999;">
  <div style="background:#0d2418;border:1px solid rgba(0,200,150,0.2);border-radius:20px;padding:40px;width:100%;max-width:360px;text-align:center;">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:32px;color:#00C896;letter-spacing:2px;margin-bottom:8px;">FRESHBIN</div>
    <div style="font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:28px;">Admin Dashboard</div>
    <div id="login-form">
      <input type="email" id="admin-email" placeholder="Email" style="width:100%;padding:14px;background:#1a3a2a;border:1px solid rgba(0,200,150,0.2);border-radius:10px;color:#fff;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;margin-bottom:10px;">
      <input type="password" id="admin-password" placeholder="Password" style="width:100%;padding:14px;background:#1a3a2a;border:1px solid rgba(0,200,150,0.2);border-radius:10px;color:#fff;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;margin-bottom:12px;">
      <button id="login-btn" style="width:100%;padding:14px;background:#00C896;border:none;border-radius:10px;color:#000;font-weight:800;font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif;">Enter Dashboard</button>
      <div id="auth-error" style="color:#ff5050;font-size:12px;margin-top:10px;display:none;"></div>
      <p onclick="showResetForm()" style="color:#00C896;font-size:12px;margin-top:14px;cursor:pointer;text-decoration:underline;">Forgot Password?</p>
    </div>
    <div id="reset-form" style="display:none;">
      <p style="font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:12px;">Enter your email and we'll send a reset link.</p>
      <input type="email" id="reset-email" placeholder="Email" style="width:100%;padding:14px;background:#1a3a2a;border:1px solid rgba(0,200,150,0.2);border-radius:10px;color:#fff;font-size:14px;font-family:'DM Sans',sans-serif;outline:none;margin-bottom:12px;">
      <button onclick="sendResetEmail()" style="width:100%;padding:14px;background:#00C896;border:none;border-radius:10px;color:#000;font-weight:800;font-size:14px;cursor:pointer;font-family:'DM Sans',sans-serif;">Send Reset Link</button>
      <p onclick="showLoginForm()" style="color:rgba(255,255,255,0.4);font-size:12px;margin-top:14px;cursor:pointer;">← Back to login</p>
      <div id="reset-success" style="color:#00C896;font-size:12px;margin-top:10px;display:none;">Reset link sent! Check your email.</div>
      <div id="reset-error" style="color:#ff5050;font-size:12px;margin-top:10px;display:none;"></div>
    </div>
  </div>
</div>

<div class="nav">
  <div class="nav-logo">🗑 FreshBin Dashboard</div>
  <div class="nav-right">
    <div class="live-dot"></div>
    <span class="live-label">Live</span>
    <button class="refresh-btn" onclick="loadBookings()">↻ Refresh</button>
    <button onclick="adminLogout()" style="background:transparent;color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 18px;font-weight:700;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;">Logout</button>
  </div>
</div>

<div class="stats-bar">
  <div class="stat-card"><div class="stat-val" id="stat-total">—</div><div class="stat-lbl">Total Bookings</div></div>
  <div class="stat-card"><div class="stat-val" id="stat-pending">—</div><div class="stat-lbl">Pending</div></div>
  <div class="stat-card"><div class="stat-val" id="stat-done">—</div><div class="stat-lbl">Completed</div></div>
  <div class="stat-card"><div class="stat-val" id="stat-revenue">—</div><div class="stat-lbl">Est. Revenue</div></div>
</div>

<div class="tabs-wrap">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('all')" id="tab-all">All <span class="tab-count" id="count-all">0</span></div>
    <div class="tab" onclick="switchTab('Monday')" id="tab-Monday">Mon <span class="tab-count" id="count-Monday">0</span></div>
    <div class="tab" onclick="switchTab('Tuesday')" id="tab-Tuesday">Tue <span class="tab-count" id="count-Tuesday">0</span></div>
    <div class="tab" onclick="switchTab('Wednesday')" id="tab-Wednesday">Wed <span class="tab-count" id="count-Wednesday">0</span></div>
    <div class="tab" onclick="switchTab('Thursday')" id="tab-Thursday">Thu <span class="tab-count" id="count-Thursday">0</span></div>
    <div class="tab" onclick="switchTab('Friday')" id="tab-Friday">Fri <span class="tab-count" id="count-Friday">0</span></div>
    <div class="tab" onclick="switchTab('Saturday')" id="tab-Saturday">Sat <span class="tab-count" id="count-Saturday">0</span></div>
  </div>
</div>

<div class="main">
  <div class="bookings-panel" id="bookings-panel">
    <div class="loading"><div class="loading-spinner"></div>Loading bookings...</div>
  </div>
  <div id="map-container"><div id="map"></div></div>
</div>

<script>
const SUPABASE_URL = 'https://fuyvrepazocbkufywexu.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1eXZyZXBhem9jYmt1Znl3ZXh1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5MzgzNzMsImV4cCI6MjA4ODUxNDM3M30.70d9VKNHI1xGVVJjKF4BvRpQa1fFq6a1cH3IRzC2FRE';

let supabaseClient;
let allBookings = [];
let currentTab = 'all';
let map, markers = [];

window.addEventListener('load', async () => {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  map = L.map('map').setView([40.7282, -73.7949], 12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '©OpenStreetMap ©CartoDB', maxZoom: 19
  }).addTo(map);

  document.getElementById('login-btn').addEventListener('click', adminLogin);
  document.getElementById('admin-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') adminLogin();
  });

  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) {
    document.getElementById('auth-gate').style.display = 'none';
    loadBookings();
  }
});

async function adminLogin() {
  const email = document.getElementById('admin-email').value.trim();
  const password = document.getElementById('admin-password').value;
  const btn = document.getElementById('login-btn');
  btn.textContent = 'Signing in...';
  btn.disabled = true;

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (error) {
    let msg = error.message;
    if (msg.includes('Invalid login credentials')) msg = 'Wrong email or password. Try again.';
    else if (msg.includes('Email not confirmed')) msg = 'Please verify your email first.';
    document.getElementById('auth-error').textContent = msg;
    document.getElementById('auth-error').style.display = 'block';
    btn.textContent = 'Enter Dashboard';
    btn.disabled = false;
  } else {
    document.getElementById('auth-gate').style.display = 'none';
    loadBookings();
  }
}

function showResetForm() {
  document.getElementById('reset-form').style.display = 'block';
  document.getElementById('login-form').style.display = 'none';
}

function showLoginForm() {
  document.getElementById('reset-form').style.display = 'none';
  document.getElementById('login-form').style.display = 'block';
}

async function sendResetEmail() {
  const email = document.getElementById('reset-email').value.trim();
  if (!email) {
    document.getElementById('reset-error').textContent = 'Please enter your email.';
    document.getElementById('reset-error').style.display = 'block';
    return;
  }
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: 'https://freshbin.nyc/bookings-dashboard.html'
  });
  if (error) {
    document.getElementById('reset-error').textContent = error.message;
    document.getElementById('reset-error').style.display = 'block';
  } else {
    document.getElementById('reset-success').style.display = 'block';
    document.getElementById('reset-error').style.display = 'none';
  }
}

async function adminLogout() {
  await supabaseClient.auth.signOut();
  location.reload();
}

async function loadBookings() {
  document.getElementById('bookings-panel').innerHTML = '<div class="loading"><div class="loading-spinner"></div>Loading bookings...</div>';
  try {
    const { data, error } = await supabaseClient.from('bookings').select('*').order('created_at', { ascending: false });
    if (error) throw error;
    allBookings = data;
    updateStats();
    updateCounts();
    renderBookings();
  } catch(e) {
    document.getElementById('bookings-panel').innerHTML = '<div class="empty">Failed to load bookings. Check connection.</div>';
  }
}

function updateStats() {
  const total = allBookings.length;
  const done = allBookings.filter(b => b.status === 'done').length;
  const pending = total - done;
  const revenue = allBookings.reduce((s,b) => s + (b.estimated_price || 0), 0);
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-pending').textContent = pending;
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-revenue').textContent = '$' + revenue.toLocaleString();
}

function updateCounts() {
  const days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  document.getElementById('count-all').textContent = allBookings.length;
  days.forEach(d => {
    const count = allBookings.filter(b => b.service_day === d).length;
    document.getElementById('count-' + d).textContent = count;
  });
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  renderBookings();
}

function renderBookings() {
  const filtered = currentTab === 'all' ? allBookings : allBookings.filter(b => b.service_day === currentTab);
  const panel = document.getElementById('bookings-panel');

  if (!filtered.length) {
    panel.innerHTML = '<div class="empty">No bookings yet for this day.</div>';
    clearMarkers();
    return;
  }

  const dayLabel = currentTab === 'all' ? 'All Bookings' : currentTab + 's Route';
  let html = `<div class="day-label">${dayLabel} (${filtered.length})</div>`;

  filtered.forEach((b, i) => {
    const isDone = b.status === 'done';
    const planLabel = b.plan === 'onetime' ? 'One-Time' : b.plan === 'monthly' ? 'Monthly' : 'Annual';
    const waterIcon = b.water_access === 'yes' ? '<span class="badge badge-water-yes">💧 Has Spigot</span>' : b.water_access === 'no' ? '<span class="badge badge-water-no">🚫 No Water</span>' : b.water_access === 'unsure' ? '<span class="badge badge-water-unsure">❓ Unsure</span>' : '';
    const price = b.estimated_price ? '$' + b.estimated_price : '—';

    html += `
    <div class="booking-card ${isDone ? 'done' : ''}" id="card-${b.id}">
      <div class="card-top">
        <div class="card-num">${i+1}</div>
        <div class="card-info">
          <div class="card-name">${b.name || '—'}</div>
          <div class="card-address">${b.address || '—'}, ${b.zip || ''}</div>
        </div>
        <div style="font-size:11px;color:rgba(255,255,255,0.35);">${b.start_month || ''}</div>
      </div>
      <div class="card-badges">
        <span class="badge badge-plan">${planLabel}</span>
        <span class="badge badge-bins">${b.bins || 1} bin${b.bins > 1 ? 's' : ''}</span>
        <span class="badge badge-price">${price}</span>
        ${waterIcon}
      </div>
      <div class="card-actions">
        <a class="action-btn btn-nav" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((b.address||'') + ' ' + (b.zip||'') + ' Queens NY')}" target="_blank">🗺 Navigate</a>
        <a class="action-btn btn-call" href="tel:${b.phone}">📞 Call</a>
        <button class="action-btn btn-done ${isDone ? 'completed' : ''}" onclick="markDone(${b.id}, ${isDone})">${isDone ? '✅ Done' : 'Mark Done'}</button>
      </div>
    </div>`;
  });

  panel.innerHTML = html;
  updateMap(filtered);
}

function clearMarkers() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
}

async function updateMap(bookings) {
  clearMarkers();
  for (let i = 0; i < bookings.length; i++) {
    const b = bookings[i];
    if (!b.address) continue;
    try {
      const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(b.address + ' ' + b.zip + ' Queens NY')}&format=json&limit=1`);
      const data = await res.json();
      if (data[0]) {
        const icon = L.divIcon({
          className: '',
          html: `<div style="background:#00C896;color:#000;font-weight:800;font-size:11px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff;">${i+1}</div>`,
          iconSize: [24,24], iconAnchor: [12,12]
        });
        const marker = L.marker([data[0].lat, data[0].lon], {icon})
          .addTo(map)
          .bindPopup(`<b>${b.name}</b><br>${b.address}<br>${b.plan} — ${b.bins} bin(s)`);
        markers.push(marker);
      }
    } catch(e) {}
  }
  if (markers.length) {
    const group = L.featureGroup(markers);
    map.fitBounds(group.getBounds().pad(0.1));
  }
}

async function markDone(id, currentlyDone) {
  const newStatus = currentlyDone ? 'pending' : 'done';
  await supabaseClient.from('bookings').update({ status: newStatus }).eq('id', id);
  await loadBookings();
}
</script>
</body>
</html>
